<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Smart Pay</title>

    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-brand-icon">💰</span>
            <span class="auth-brand-name">Smart Pay</span>
        </div>

        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Choose a new password for your account.</p>

        <form id="resetForm" novalidate>
             <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
            >
             <div id="passwordStrength" class="auth-strength">
                Password strength: —
            </div>

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >

            <p id="passwordError" class="auth-message" role="alert"></p>

            <button type="submit" class="auth-submit" id="updatePasswordBtn">
                Update Password
            </button>

        </form>
        <a href="login.html" class="auth-foot-link">
            ← Back to Log In
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/apiConfig.js"></script>
    <script src="/js/resetpassword.js"></script>

</body>

</html>
