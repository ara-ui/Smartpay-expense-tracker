<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Required | Smart Pay</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/userHeader.css">
    <link rel="stylesheet" href="css/premium-required.css">
</head>

<body>

    <div id="userHeaderContainer"></div>

    <div class="premium-page">

        <div class="premium-card">

            <div class="premium-icon">
                ⭐
            </div>

            <h1>Premium Feature</h1>

            <p class="premium-title">
                Premium membership required
            </p>

            <p class="premium-description">
                Upgrade to unlock advanced reports, analytics and exports.
            </p>

            <div class="premium-benefits">

                <h3>Unlock with Premium</h3>

                <ul>
                    <li>✓ Advanced expense reports</li>
                    <li>✓ Spending analytics</li>
                    <li>✓ Budget &amp; budget rules</li>
                    <li>✓ Payments &amp; payment history</li>
                    <li>✓ Leaderboard &amp; exports</li>
                </ul>

            </div>

            <div class="premium-actions">

                <button id="upgradeBtn" class="upgrade-btn">
                    ⭐ Upgrade to Premium
                </button>

                <button
                    type="button"
                    class="dashboard-btn"
                    id="dashboardBtn">
                    ← Back to Dashboard
                </button>

            </div>

        </div>

    </div>


    <!-- Existing project dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

    <script src="js/apiConfig.js"></script>

    <script src="js/modules/auth.js"></script>

    <script src="js/modules/userHeader.js"></script>


    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="js/modules/premium.js"></script>
    <script src="js/premium-required.js"></script>
</body>

</html>
