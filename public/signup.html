<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        

        <script src="js/theme.js"></script>
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/auth.css">
    </head>
    <body class="auth-page">

        <div class="auth-card">
            <div class="auth-brand">
                <span class="auth-brand-icon">💰</span>
                <span class="auth-brand-name">Smart Pay</span>
            </div>

            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Track spending. Manage budgets. Spend smarter.</p>

            <form id="signupForm" novalidate>
                <label for="name">Name</label>
                <input type="text" id="name" autocomplete="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" required>

                <p id="signupMessage" class="auth-message" role="alert"></p>

                <button type="submit" class="auth-submit signup-btn" id="signupSubmitBtn">Sign Up</button>
            </form>

            <a href="login.html" class="auth-foot-link login-link">Already have an account? Log in</a>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/apiConfig.js"></script>
    <script src="js/script.js"></script>
    </body>
</html>
