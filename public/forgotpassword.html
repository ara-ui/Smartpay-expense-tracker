<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Pay</title>

    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">
        <span class="auth-brand-icon">💰</span>
        <span class="auth-brand-name">Smart Pay</span>
    </div>

    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-subtitle">Enter your registered email and we'll send you a link to reset it.</p>

    <form id="forgotForm" novalidate>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

        <p id="forgotMessage" class="auth-message" role="alert"></p>

        <button type="submit" class="auth-submit" id="forgotSubmitBtn">
            Send Reset Link
        </button>

    </form>

    <a href="login.html" class="auth-foot-link back-login">← Back to Log In</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="js/apiConfig.js"></script>
<script src="js/forgotpassword.js"></script>

</body>
</html>
