<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        

        <script src="js/theme.js"></script>
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/auth.css">
    </head>
    <body class="auth-page">

        <div class="auth-card">
            <div class="auth-brand">
                <span class="auth-brand-icon">💰</span>
                <span class="auth-brand-name">Smart Pay</span>
            </div>

            <h1 class="auth-title">Welcome back</h1>
          
            <form id="loginForm" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <p id="loginMessage" class="auth-message" role="alert"></p>

                <button type="submit" class="auth-submit login-btn" id="loginSubmitBtn">Log In</button>
            </form>

            <p class="auth-links"><a href="forgotpassword.html">Forgot your password?</a></p>
            <a href="signup.html" class="auth-foot-link signup-link">New here? Create an account</a>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="js/apiConfig.js"></script>
        <script src="js/login.js"></script>
</body>
</html>
